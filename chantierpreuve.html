<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ChantierPreuve</title>

<!-- Tailwind CSS (CDN). Pour une mise en production, compilez Tailwind et supprimez ce script. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: '#1e293b', safety: '#fbbf24' } } } };
</script>

<style>
  /* Rien n'est imprimé sauf le rapport : l'application est masquée à l'impression */
  @media print {
    @page { margin: 14mm; }
    body { background: #fff !important; }
    .report-photo { break-inside: avoid; }
    .report-entry { break-inside: avoid; }
  }
</style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased">

<!-- ============================ APPLICATION ============================ -->
<div id="app" class="print:hidden">

  <header class="bg-brand text-white px-4 pt-6 pb-5">
    <div class="max-w-xl mx-auto">
      <h1 class="text-2xl font-extrabold tracking-tight">Chantier<span class="text-safety">Preuve</span></h1>
      <p class="text-slate-300 text-sm mt-1">Ne perdez plus jamais un centime ou un procès à cause d’un malentendu client.</p>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-5 space-y-6">

    <!-- ---------- 1. CAPTURE DE PREUVE ---------- -->
    <section class="bg-white rounded-2xl shadow-sm p-4 space-y-4">
      <h2 class="text-lg font-bold">Nouvelle preuve</h2>

      <div>
        <label for="client" class="block text-sm font-semibold mb-1">Client ou chantier</label>
        <input id="client" type="text" list="clients" placeholder="Ex. : M. Dupont – salle de bain"
               class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-safety">
        <datalist id="clients"></datalist>
      </div>

      <!-- Photo : sur mobile, "capture" ouvre directement l'appareil photo -->
      <div>
        <span class="block text-sm font-semibold mb-1">Photo</span>
        <input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden">
        <button id="photoBtn" type="button"
                class="w-full rounded-xl border-2 border-dashed border-slate-300 text-slate-600 py-4 font-semibold active:bg-slate-50">
          📷 Prendre ou importer une photo
        </button>
        <img id="photoPreview" alt="Aperçu de la photo" class="hidden mt-3 w-full max-h-64 object-cover rounded-xl">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="desc" class="text-sm font-semibold">Travail réalisé</label>
          <button id="micBtn" type="button" class="text-sm font-semibold rounded-lg bg-slate-100 px-3 py-1.5 active:bg-slate-200">🎤 Dicter</button>
        </div>
        <textarea id="desc" rows="4" placeholder="Ex. : Carrelage posé dans la douche. Client informé du retard de livraison du receveur."
                  class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-safety"></textarea>
        <p id="micHint" class="text-xs text-slate-500 mt-1 min-h-[1rem]"></p>
      </div>

      <!-- Horodatage + lieu (automatiques) -->
      <div class="rounded-xl bg-slate-50 p-3 text-sm space-y-2">
        <div class="flex justify-between gap-2"><span class="text-slate-500">Date et heure</span><strong id="clock" class="text-right"></strong></div>
        <div class="flex justify-between gap-2"><span class="text-slate-500">Position GPS</span><strong id="gps" class="text-right">Recherche…</strong></div>
        <input id="place" type="text" placeholder="Adresse ou lieu (si le GPS est indisponible)"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-safety">
        <button id="gpsBtn" type="button" class="text-xs font-semibold underline text-slate-600">Actualiser la position</button>
      </div>

      <button id="saveBtn" type="button"
              class="w-full rounded-xl bg-safety text-brand font-extrabold text-lg py-4 shadow active:scale-[.99]">
        Enregistrer dans le carnet
      </button>
      <p id="msg" class="text-sm text-center min-h-[1.25rem]" role="status"></p>
    </section>

    <!-- ---------- 2. CARNET DE CHANTIER ---------- -->
    <section>
      <h2 class="text-lg font-bold mb-3">Carnet de chantier</h2>
      <div id="journal" class="space-y-5"></div>
    </section>
  </main>
</div>

<!-- ============================ RAPPORT (imprimé / PDF) ============================ -->
<div id="report" class="hidden print:block text-slate-900"></div>

<script>
/* =====================================================================
   ChantierPreuve – logique de l'application
   Données : localStorage, clé "chantierpreuve:v1"
   ===================================================================== */
(() => {
  'use strict';

  const STORE_KEY = 'chantierpreuve:v1';
  const $ = (id) => document.getElementById(id);

  let entries = load();          // tableau des preuves enregistrées
  let currentPhoto = null;       // photo en cours (data URL redimensionnée)
  let currentPos = null;         // { lat, lon, acc } ou null

  /* ---------- Stockage ---------- */
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); return true; }
    catch { return false; }      // quota dépassé
  }

  /* ---------- Utilitaires ---------- */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (iso) => new Date(iso).toLocaleString('fr-FR', { dateStyle: 'full', timeStyle: 'medium' });
  const fmtShort = (iso) => new Date(iso).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });

  function say(text, ok = true) {
    const m = $('msg');
    m.textContent = text;
    m.className = 'text-sm text-center min-h-[1.25rem] ' + (ok ? 'text-green-700' : 'text-red-600');
    setTimeout(() => { if (m.textContent === text) m.textContent = ''; }, 3500);
  }

  /* Empreinte SHA-256 : permet de montrer que le contenu n'a pas été modifié après coup */
  async function fingerprint(obj) {
    try {
      const data = new TextEncoder().encode(JSON.stringify(obj));
      const buf = await crypto.subtle.digest('SHA-256', data);
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 16).toUpperCase();
    } catch { return 'non disponible'; }
  }

  /* ---------- Horloge en direct ---------- */
  const tick = () => { $('clock').textContent = fmtDate(new Date().toISOString()); };
  tick(); setInterval(tick, 1000);

  /* ---------- Géolocalisation ---------- */
  function locate() {
    const g = $('gps');
    if (!navigator.geolocation) { g.textContent = 'Indisponible (saisie manuelle)'; return; }
    g.textContent = 'Recherche…';
    navigator.geolocation.getCurrentPosition(
      (p) => {
        currentPos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) };
        g.textContent = `${currentPos.lat.toFixed(5)}, ${currentPos.lon.toFixed(5)} (±${currentPos.acc} m)`;
      },
      () => { currentPos = null; g.textContent = 'Refusée ou indisponible'; },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
    );
  }
  $('gpsBtn').onclick = locate;
  locate();

  /* ---------- Photo (redimensionnée pour économiser le stockage) ---------- */
  $('photoBtn').onclick = () => $('photoInput').click();
  $('photoInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const max = 1000, ratio = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * ratio);
      c.height = Math.round(img.height * ratio);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      currentPhoto = c.toDataURL('image/jpeg', 0.7);
      const prev = $('photoPreview');
      prev.src = currentPhoto;
      prev.classList.remove('hidden');
      $('photoBtn').textContent = '📷 Changer la photo';
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  };

  /* ---------- Dictée vocale (si le navigateur la prend en charge) ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, base = '';
  if (!SR) {
    $('micBtn').disabled = true;
    $('micBtn').classList.add('opacity-40');
    $('micHint').textContent = 'Dictée non disponible sur ce navigateur.';
  } else {
    rec = new SR();
    rec.lang = 'fr-FR'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (e) => {
      let t = '';
      for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      $('desc').value = base + t;
    };
    rec.onend = () => stopMic();
    rec.onerror = () => { $('micHint').textContent = 'Micro indisponible ou refusé.'; stopMic(); };
    $('micBtn').onclick = () => {
      if (listening) { rec.stop(); return; }
      base = $('desc').value ? $('desc').value.trimEnd() + ' ' : '';
      try { rec.start(); } catch { return; }
      listening = true;
      $('micBtn').textContent = '⏹ Arrêter';
      $('micHint').textContent = 'Je vous écoute…';
    };
  }
  function stopMic() {
    listening = false;
    $('micBtn').textContent = '🎤 Dicter';
    if ($('micHint').textContent === 'Je vous écoute…') $('micHint').textContent = '';
  }

  /* ---------- Enregistrement d'une preuve ---------- */
  $('saveBtn').onclick = async () => {
    const client = $('client').value.trim();
    const desc = $('desc').value.trim();
    if (!client) return say('Indiquez le client ou le chantier.', false);
    if (!desc && !currentPhoto) return say('Ajoutez une photo ou une description.', false);

    // Lieu : coordonnées GPS si disponibles, sinon saisie manuelle
    const place = $('place').value.trim();
    const gps = currentPos ? `${currentPos.lat.toFixed(5)}, ${currentPos.lon.toFixed(5)} (±${currentPos.acc} m)` : '';
    const entry = {
      id: Date.now().toString(36),
      client, desc, photo: currentPhoto,
      ts: new Date().toISOString(),          // horodatage exact au moment de l'enregistrement
      place: [place, gps].filter(Boolean).join(' – ') || 'Lieu non renseigné',
    };
    entry.hash = await fingerprint({ c: entry.client, d: entry.desc, t: entry.ts, p: entry.place, ph: entry.photo ? entry.photo.length : 0 });

    entries.unshift(entry);
    if (!save()) {
      entries.shift();
      return say('Stockage plein : supprimez d’anciennes photos ou exportez un rapport.', false);
    }

    // Réinitialise le formulaire (le nom du client est conservé pour enchaîner les preuves)
    $('desc').value = ''; $('place').value = '';
    currentPhoto = null; $('photoInput').value = '';
    $('photoPreview').classList.add('hidden');
    $('photoBtn').textContent = '📷 Prendre ou importer une photo';
    say('Preuve enregistrée ✔');
    render();
  };

  /* ---------- Affichage du carnet (regroupé par client / chantier) ---------- */
  function render() {
    // Suggestions de clients déjà utilisés
    const names = [...new Set(entries.map((e) => e.client))];
    $('clients').innerHTML = names.map((n) => `<option value="${esc(n)}">`).join('');

    const j = $('journal');
    if (!entries.length) {
      j.innerHTML = '<p class="text-slate-500 text-sm bg-white rounded-2xl p-4">Aucune preuve pour le moment. Votre première entrée apparaîtra ici.</p>';
      return;
    }
    j.innerHTML = names.map((name) => {
      const list = entries.filter((e) => e.client === name);
      return `
      <article class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <div class="bg-brand text-white px-4 py-3">
          <h3 class="font-bold">${esc(name)}</h3>
          <p class="text-xs text-slate-300">${list.length} preuve${list.length > 1 ? 's' : ''}</p>
        </div>
        <ul class="divide-y divide-slate-100">
          ${list.map((e) => `
            <li class="p-4 flex gap-3">
              ${e.photo ? `<img src="${e.photo}" alt="Photo" class="w-20 h-20 rounded-lg object-cover shrink-0">` : ''}
              <div class="min-w-0 flex-1">
                <p class="text-sm whitespace-pre-wrap break-words">${esc(e.desc) || '<em class="text-slate-400">Sans description</em>'}</p>
                <p class="text-xs text-slate-500 mt-1">🕒 ${fmtShort(e.ts)}</p>
                <p class="text-xs text-slate-500 break-words">📍 ${esc(e.place)}</p>
                <button data-del="${e.id}" class="text-xs text-red-600 underline mt-1">Supprimer</button>
              </div>
            </li>`).join('')}
        </ul>
        <div class="p-3 bg-slate-50 grid grid-cols-2 gap-2">
          <button data-pdf="${esc(name)}" class="rounded-xl bg-safety text-brand font-bold py-3 text-sm">📄 Générer le rapport PDF</button>
          <button data-wa="${esc(name)}" class="rounded-xl bg-green-600 text-white font-bold py-3 text-sm">WhatsApp</button>
        </div>
      </article>`;
    }).join('');
  }

  /* Délégation d'événements pour les boutons du carnet */
  $('journal').addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.del) {
      if (confirm('Supprimer cette preuve définitivement ?')) {
        entries = entries.filter((e) => e.id !== b.dataset.del);
        save(); render();
      }
    } else if (b.dataset.pdf !== undefined) printReport(b.dataset.pdf);
    else if (b.dataset.wa !== undefined) shareWhatsApp(b.dataset.wa);
  });

  /* ---------- 3. Rapport PDF ----------
     Le rapport est construit dans #report, puis window.print() ouvre la boîte
     d'impression : choisissez « Enregistrer au format PDF », puis partagez le
     fichier par email ou WhatsApp. Fonctionne sans aucune bibliothèque externe. */
  function printReport(client) {
    const list = entries.filter((e) => e.client === client).sort((a, b) => a.ts.localeCompare(b.ts));
    if (!list.length) return;
    const first = fmtShort(list[0].ts), last = fmtShort(list[list.length - 1].ts);

    $('report').innerHTML = `
      <div class="border-b-4 border-slate-800 pb-3 mb-5">
        <p class="text-sm font-bold tracking-wide">CHANTIERPREUVE</p>
        <h1 class="text-3xl font-extrabold mt-1">Rapport d’intervention</h1>
      </div>
      <table class="w-full text-sm mb-6">
        <tr><td class="py-1 pr-4 text-slate-500 w-40">Client / chantier</td><td class="font-semibold">${esc(client)}</td></tr>
        <tr><td class="py-1 pr-4 text-slate-500">Période</td><td>${first} → ${last}</td></tr>
        <tr><td class="py-1 pr-4 text-slate-500">Interventions</td><td>${list.length}</td></tr>
        <tr><td class="py-1 pr-4 text-slate-500">Édité le</td><td>${fmtDate(new Date().toISOString())}</td></tr>
      </table>

      ${list.map((e, i) => `
        <section class="report-entry mb-6 pb-4 border-b border-slate-300">
          <h2 class="font-bold mb-1">Intervention ${i + 1} – ${fmtDate(e.ts)}</h2>
          <p class="text-sm text-slate-600 mb-2">Lieu : ${esc(e.place)}</p>
          <p class="whitespace-pre-wrap mb-3">${esc(e.desc) || '—'}</p>
          ${e.photo ? `<img src="${e.photo}" alt="Photo de l’intervention" class="report-photo max-h-80 rounded">` : ''}
          <p class="text-xs text-slate-500 mt-2">Empreinte d’intégrité : ${esc(e.hash)}</p>
        </section>`).join('')}

      <div class="report-entry mt-8 grid grid-cols-2 gap-8 text-sm">
        <div><p class="font-semibold mb-12">L’artisan</p><div class="border-t border-slate-400 pt-1">Signature</div></div>
        <div><p class="font-semibold mb-12">Le client (« Lu et approuvé »)</p><div class="border-t border-slate-400 pt-1">Signature</div></div>
      </div>
      <p class="text-xs text-slate-500 mt-6">Document généré automatiquement à partir de données horodatées au moment de leur saisie.</p>`;

    // Le titre du document devient le nom de fichier proposé à l'enregistrement
    const oldTitle = document.title;
    document.title = 'Rapport - ' + client;
    window.print();
    document.title = oldTitle;
  }

  /* ---------- Partage WhatsApp (résumé texte) ---------- */
  function shareWhatsApp(client) {
    const list = entries.filter((e) => e.client === client).sort((a, b) => a.ts.localeCompare(b.ts));
    const text = `*Compte-rendu – ${client}*\n\n` +
      list.map((e) => `• ${fmtShort(e.ts)} : ${e.desc || '(photo)'}`).join('\n') +
      '\n\nRapport PDF détaillé en pièce jointe.';
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }

  /* ---------- PWA : manifeste généré à la volée (fichier unique) ----------
     Pour une installation complète « hors ligne », hébergez le fichier en HTTPS
     et ajoutez un service worker (sw.js) qui met en cache cette page. Un service
     worker ne peut pas être déclaré depuis un fichier HTML seul. */
  const icon = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#1e293b"/><path d="M52 100l30 30 60-70" fill="none" stroke="#fbbf24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  const manifest = {
    name: 'ChantierPreuve', short_name: 'ChantierPreuve', display: 'standalone',
    background_color: '#1e293b', theme_color: '#1e293b', start_url: '.',
    icons: [{ src: icon, sizes: '192x192', type: 'image/svg+xml' }],
  };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  document.head.appendChild(link);

  render();
})();
</script>
</body>
</html>
